name: Build extension zip

on:
  push:
    tags: ['v*']        # tagging a version publishes a Release with the zip attached
  workflow_dispatch:    # manual runs produce a downloadable artifact

permissions:
  contents: write       # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage extension files
        run: |
          mkdir -p dist/trip-mapper
          cp -r manifest.json background.js index.html app.js style.css icons vendor README.md dist/trip-mapper/

      - name: Create zip
        run: |
          cd dist
          zip -r trip-mapper-extension.zip trip-mapper

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-mapper-extension
          path: dist/trip-mapper-extension.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/trip-mapper-extension.zip
          body: |
            Trip Mapper Chrome extension.

            **Install:** download `trip-mapper-extension.zip`, unzip it, then in
            `chrome://extensions` enable Developer mode → **Load unpacked** → select
            the unzipped `trip-mapper` folder.
