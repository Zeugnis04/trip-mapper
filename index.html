<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <div id="topbar">
    <h1>Trip Mapper</h1>
    <!-- UI theme toggle -->
    <button class="btn-icon" id="btn-ui-theme" title="Toggle light/dark">🌙</button>
    <div class="toolbar-divider"></div>
    <label class="toolbar-label">Map</label>
    <select class="toolbar-select" id="theme-select">
      <option value="voyager">Voyager</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="osm">OSM</option>
    </select>
    <div class="toolbar-divider"></div>
    <label class="toolbar-label">Label Font</label>
    <select class="toolbar-select" id="label-font-select"></select>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-green"  id="btn-export">Export</button>
    <button class="btn btn-yellow" id="btn-import">Import</button>
    <button class="btn btn-red"    id="btn-clear">Clear</button>
    <input class="hidden-file-input" id="file-input" type="file" accept=".json" />
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="form-section">
        <div class="mode-row" id="mode-row">
          <span class="mode-label">TRAVEL MODE TO NEXT STOP</span>
          <div class="mode-btns" id="next-mode-btns"></div>
        </div>
        <div class="form-row form-row-tight">
          <input class="flex-fill" id="loc-search" type="text" placeholder="Search a place…" />
          <button class="btn btn-accent btn-search" id="btn-search">Go</button>
        </div>
        <div id="search-drop"></div>
        <button class="btn btn-green btn-full" id="btn-pick-loc">📌 Pick on map</button>
      </div>
      <div class="item-list" id="loc-list"></div>
    </div>
    <div id="map"></div>
  </div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
