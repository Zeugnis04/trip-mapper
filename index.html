<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app { height: 100%; overflow: hidden; font-family: var(--font-family); font-size: 13px; }

    /* ── Themes ── */
    :root {
      --bg0: #1e1e2e; --bg1: #181825; --bg2: #313244; --bg3: #45475a;
      --fg: #cdd6f4;  --fg2: #a6adc8;
      --accent: #89b4fa; --green: #a6e3a1; --yellow: #f9e2af; --red: #f38ba8;
      --shadow: rgba(0,0,0,.4);
      --font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    :root[data-theme="light"] {
      --bg0: #f4f4f5; --bg1: #ffffff; --bg2: #e4e4e7; --bg3: #d4d4d8;
      --fg: #18181b;  --fg2: #71717a;
      --accent: #3b82f6; --green: #16a34a; --yellow: #ca8a04; --red: #dc2626;
      --shadow: rgba(0,0,0,.12);
    }

    #app { display: flex; flex-direction: column; background: var(--bg0); color: var(--fg); }

    /* ── Top bar ── */
    #topbar {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; background: var(--bg1);
      border-bottom: 1px solid var(--bg3); color: var(--fg);
    }
    #topbar h1 { font-size: 15px; font-weight: 700; margin-right: 4px; white-space: nowrap; }

    /* ── Main ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 278px; flex-shrink: 0; background: var(--bg0);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--bg3); overflow: hidden;
    }
    .form-section {
      padding: 10px; border-bottom: 1px solid var(--bg3);
      display: flex; flex-direction: column; gap: 6px;
    }
    .form-row { display: flex; gap: 6px; align-items: center; }

    /* ── Inputs ── */
    input[type="text"], select {
      background: var(--bg2); border: 1px solid var(--bg3);
      color: var(--fg); border-radius: 5px; padding: 4px 7px;
      font-size: 12px; width: 100%;
    }
    input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }

    /* ── Buttons ── */
    .btn {
      padding: 5px 10px; border: none; border-radius: 5px;
      cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap;
      background: var(--bg2); color: var(--fg);
    }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-green  { background: var(--green);  color: #18181b; }
    .btn-yellow { background: var(--yellow); color: #18181b; }
    .btn-red    { background: var(--red);    color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-icon {
      padding: 4px 6px; border: none; border-radius: 5px;
      background: none; cursor: pointer; font-size: 15px; line-height: 1;
      color: var(--fg2); flex-shrink: 0;
    }
    .btn-icon:hover { background: var(--bg2); }
    .btn-sm {
      padding: 2px 7px; font-size: 11px; background: var(--bg3);
      color: var(--fg2); border: none; border-radius: 4px; cursor: pointer; flex-shrink: 0;
    }
    .btn-sm.fly:hover  { background: var(--accent); color: #fff; }
    .btn-sm.del:hover  { background: var(--red);    color: #fff; }
    .btn-sm.edit:hover { background: var(--yellow); color: #18181b; }

    /* ── Mode emoji buttons ── */
    .mode-btns { display: flex; gap: 3px; flex-wrap: nowrap; }
    .mode-btn {
      width: 26px; height: 24px; border: none; border-radius: 5px;
      background: var(--bg2); cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .12s;
    }
    .mode-btn:hover:not(.active) { background: var(--bg3); }
    .mode-btn.active { background: var(--accent); }

    /* ── Location list ── */
    .item-list {
      flex: 1; overflow-y: auto; padding: 6px;
      display: flex; flex-direction: column; gap: 0;
    }
    .item-list::-webkit-scrollbar { width: 5px; }
    .item-list::-webkit-scrollbar-track { background: var(--bg1); }
    .item-list::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }

    .list-item {
      background: var(--bg2); border-radius: 6px;
      padding: 6px 8px; display: flex; align-items: center; gap: 6px;
    }
    .item-body { flex: 1; overflow: hidden; }
    .item-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub  { color: var(--fg2); font-size: 11px; }
    .loc-num {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 700; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Timeline connector ── */
    .connector {
      display: flex; flex-direction: column;
      padding: 2px 8px 2px 15px; gap: 4px;
    }
    .connector-row {
      display: flex; align-items: center; gap: 5px;
    }
    .connector-bar {
      width: 2px; height: 10px; background: var(--bg3);
      border-radius: 1px; flex-shrink: 0;
    }
    .connector-spacer { flex: 1; }
    .style-toggle {
      padding: 0 5px; border: none; border-radius: 4px;
      background: none; cursor: pointer; font-size: 13px; color: var(--fg2);
      flex-shrink: 0; line-height: 22px;
    }
    .style-toggle:hover { background: var(--bg2); color: var(--fg); }
    .style-toggle.open  { background: var(--bg2); color: var(--accent); }

    /* ── Style panel ── */
    .style-panel {
      background: var(--bg1); border: 1px solid var(--bg3);
      border-radius: 7px; padding: 8px; display: flex;
      flex-direction: column; gap: 7px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .sp-row { display: flex; align-items: center; gap: 5px; }
    .sp-label { font-size: 10px; color: var(--fg2); min-width: 32px; }

    /* Swatches */
    .swatch {
      width: 17px; height: 17px; border-radius: 4px; cursor: pointer;
      border: 2px solid transparent; flex-shrink: 0; transition: transform .1s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: var(--fg); }
    .swatch-custom {
      width: 17px; height: 17px; border-radius: 4px; cursor: pointer;
      border: 1px dashed var(--bg3); overflow: hidden; flex-shrink: 0;
      position: relative;
    }
    .swatch-custom input[type="color"] {
      position: absolute; inset: -4px; width: calc(100% + 8px);
      height: calc(100% + 8px); border: none; cursor: pointer; opacity: 0;
    }
    .swatch-custom-fill {
      width: 100%; height: 100%; border-radius: 3px;
      background: conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
    }

    /* Dash / weight buttons */
    .sp-btn {
      padding: 2px 7px; font-size: 11px; border: none; border-radius: 4px;
      background: var(--bg2); color: var(--fg2); cursor: pointer; flex-shrink: 0;
    }
    .sp-btn:hover   { background: var(--bg3); }
    .sp-btn.active  { background: var(--accent); color: #fff; }

    /* Color swatch row wraps */
    .sp-row-wrap { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

    /* Palette accordion */
    .palette-entry {
      border-radius: 5px; overflow: hidden;
      border: 1px solid var(--bg3);
    }
    .palette-header {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 6px; cursor: pointer; background: var(--bg2);
    }
    .palette-header:hover { background: var(--bg3); }
    .palette-header.open  { background: var(--bg3); }
    .palette-name { font-size: 11px; color: var(--fg2); flex: 1; }
    .palette-strip { display: flex; gap: 2px; flex-shrink: 0; }
    .palette-strip span { width: 9px; height: 14px; border-radius: 2px; display: block; }
    .palette-body {
      display: none; flex-direction: column; gap: 5px;
      padding: 6px; background: var(--bg1);
    }
    .palette-body.open { display: flex; }
    .palette-swatches { display: flex; gap: 4px; flex-wrap: wrap; }
    .palette-apply {
      align-self: flex-start; padding: 2px 8px; font-size: 10px;
      border: none; border-radius: 4px; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    .palette-apply:hover { opacity: .85; }

    /* Width slider */
    .sp-slider { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .sp-slider-val { font-size: 11px; color: var(--fg2); min-width: 28px; text-align: right; flex-shrink: 0; }

    /* Apply-to-all button */
    .sp-all {
      padding: 2px 6px; font-size: 10px; border: none; border-radius: 4px;
      background: var(--bg3); color: var(--fg2); cursor: pointer; flex-shrink: 0; margin-left: auto;
    }
    .sp-all:hover { background: var(--accent); color: #fff; }

    /* Palette apply-mode toggle */
    .pal-mode-row { display: flex; align-items: center; gap: 4px; }
    .pal-mode-row .sp-label { flex: 1; }

    /* ── Search dropdown ── */
    #search-drop {
      display: none; flex-direction: column; background: var(--bg2);
      border: 1px solid var(--bg3); border-radius: 5px;
      max-height: 190px; overflow-y: auto;
    }
    .s-item {
      padding: 6px 8px; cursor: pointer;
      border-bottom: 1px solid var(--bg3); flex-shrink: 0;
    }
    .s-item:last-child { border-bottom: none; }
    .s-item:hover { background: var(--bg3); }
    .s-item-name { font-size: 12px; font-weight: 600; }
    .s-item-sub  { font-size: 10px; color: var(--fg2); margin-top: 1px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Map ── */
    #map { flex: 1; }
    #map.pick-mode { cursor: crosshair; }
    /* Leaflet tooltip base override for location labels */
    .leaflet-tooltip.loc-label-tt {
      border-width: 2px;
      font-family: var(--font-family);
      font-weight: 700;
      white-space: nowrap;
      padding: 2px 6px;
      transition: opacity .18s;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: var(--bg1); color: var(--fg);
      padding: 5px 16px; border-radius: 20px; font-size: 12px;
      pointer-events: none; opacity: 0; transition: opacity .25s;
      z-index: 9999; border: 1px solid var(--bg3);
      box-shadow: 0 2px 8px var(--shadow);
    }
    #toast.show { opacity: 1; }

    .empty-hint { color: var(--fg2); font-size: 12px; text-align: center; padding: 20px 12px; line-height: 1.6; }

    /* ── Location edit panel ── */
    .loc-edit-panel {
      background: var(--bg1); border: 1px solid var(--bg3);
      border-radius: 7px; padding: 8px;
      display: flex; flex-direction: column; gap: 7px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .lep-row { display: flex; align-items: center; gap: 6px; }
    .lep-row.top { align-items: flex-start; }
    .lep-label { font-size: 10px; color: var(--fg2); min-width: 52px; flex-shrink: 0; padding-top: 1px; }
    .lep-input {
      flex: 1; background: var(--bg2); border: 1px solid var(--bg3);
      color: var(--fg); border-radius: 5px; padding: 3px 6px;
      font-size: 12px; font-family: var(--font-family); width: 100%;
    }
    .lep-input:focus { outline: none; border-color: var(--accent); }
    textarea.lep-input { resize: vertical; min-height: 46px; line-height: 1.5; }
    input[type="date"].lep-input { color-scheme: dark; }
    :root[data-theme="light"] input[type="date"].lep-input { color-scheme: light; }

    /* Shape picker */
    .shape-btn {
      width: 26px; height: 26px; border: none; border-radius: 5px;
      background: var(--bg2); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--fg2);
    }
    .shape-btn.active { background: var(--accent); color: #fff; }
    .shape-btn:hover:not(.active) { background: var(--bg3); }
  </style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <h1>Trip Mapper</h1>
    <!-- UI theme toggle -->
    <button class="btn-icon" id="btn-ui-theme" title="Toggle light/dark">🌙</button>
    <div style="width:1px;height:18px;background:var(--bg3);flex-shrink:0;"></div>
    <label style="color:var(--fg2);font-size:12px;white-space:nowrap;">Map</label>
    <select id="theme-select" style="width:120px;">
      <option value="voyager">Voyager</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="osm">OSM</option>
    </select>
    <div style="width:1px;height:18px;background:var(--bg3);flex-shrink:0;"></div>
    <label style="color:var(--fg2);font-size:12px;white-space:nowrap;">Font</label>
    <select id="font-select" style="width:120px;"></select>
    <div style="flex:1"></div>
    <button class="btn btn-green"  id="btn-export">Export</button>
    <button class="btn btn-yellow" id="btn-import">Import</button>
    <button class="btn btn-red"    id="btn-clear">Clear</button>
    <input id="file-input" type="file" accept=".json" style="display:none" />
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="form-section">
        <div id="mode-row" style="display:none; flex-direction:column; gap:4px;">
          <span style="color:var(--fg2);font-size:10px;">TRAVEL MODE TO NEXT STOP</span>
          <div class="mode-btns" id="next-mode-btns"></div>
        </div>
        <div class="form-row" style="gap:4px;">
          <input id="loc-search" type="text" placeholder="Search a place…" style="flex:1;" />
          <button class="btn btn-accent" id="btn-search" style="padding:5px 9px;">Go</button>
        </div>
        <div id="search-drop"></div>
        <button class="btn btn-green" id="btn-pick-loc" style="width:100%;">📌 Pick on map</button>
      </div>
      <div class="item-list" id="loc-list"></div>
    </div>
    <div id="map"></div>
  </div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Themes ────────────────────────────────────────────────────────────────────
const THEMES = {
  voyager: { url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
             attr: '© <a href="https://openstreetmap.org/copyright">OSM</a> contributors, © <a href="https://carto.com/">CARTO</a>', sub: 'abcd' },
  light:   { url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
             attr: '© <a href="https://openstreetmap.org/copyright">OSM</a> contributors, © <a href="https://carto.com/">CARTO</a>', sub: 'abcd' },
  dark:    { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
             attr: '© <a href="https://openstreetmap.org/copyright">OSM</a> contributors, © <a href="https://carto.com/">CARTO</a>', sub: 'abcd' },
  osm:     { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
             attr: '© <a href="https://openstreetmap.org/copyright">OSM</a> contributors', sub: 'abc' },
};

// ── Route type metadata ───────────────────────────────────────────────────────
const ROUTE_META = {
  car:     { color: '#e67e22', dashArray: null,   weight: 4, routing: 'osrm-driving' },
  walk:    { color: '#27ae60', dashArray: '5 5',  weight: 3, routing: 'osrm-foot'    },
  bicycle: { color: '#f39c12', dashArray: '5 5',  weight: 3, routing: 'osrm-cycling' },
  flight:  { color: '#3498db', dashArray: '10 6', weight: 2, routing: 'greatcircle'  },
  ferry:   { color: '#16a085', dashArray: '5 10', weight: 3, routing: 'straight'     },
  subway:  { color: '#9b59b6', dashArray: null,   weight: 4, routing: 'straight'     },
  train:   { color: '#c0392b', dashArray: null,   weight: 4, routing: 'straight'     },
};
const TYPE_EMOJI = { car:'🚗', walk:'🚶', bicycle:'🚲', flight:'✈️', ferry:'⛴️', subway:'🚇', train:'🚆' };

// ── Color palettes ────────────────────────────────────────────────────────────
const PALETTES = {
  'Type default': null,
  Neon:   ['#ff006e','#fb5607','#ffbe0b','#06d6a0','#3a86ff','#8338ec','#f72585'],
  Pastel: ['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff'],
  Earth:  ['#7c4a1e','#c07941','#d4a030','#557a55','#4e7c8c','#6d6a75','#8b5e52'],
  Ocean:  ['#03045e','#0077b6','#0096c7','#00b4d8','#48cae4','#90e0ef','#ade8f4'],
  Mono:   ['#f0f0f0','#c0c0c0','#909090','#606060','#404040','#202020','#888888'],
};
const NEUTRAL_COLOR = '#888888';

// ── Font options ──────────────────────────────────────────────────────────────
const FONTS = [
  { name: 'System UI',      stack: 'system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif', gf: null },
  { name: 'Inter',          stack: '"Inter",system-ui,sans-serif',                                      gf: 'Inter:wght@400;600;700' },
  { name: 'Roboto',         stack: '"Roboto",system-ui,sans-serif',                                     gf: 'Roboto:wght@400;700' },
  { name: 'Nunito',         stack: '"Nunito",system-ui,sans-serif',                                     gf: 'Nunito:wght@400;600;700' },
  { name: 'Lato',           stack: '"Lato",system-ui,sans-serif',                                       gf: 'Lato:wght@400;700' },
  { name: 'Merriweather',   stack: '"Merriweather",Georgia,"Times New Roman",serif',                    gf: 'Merriweather:wght@400;700' },
  { name: 'Playfair',       stack: '"Playfair Display",Georgia,"Times New Roman",serif',                gf: 'Playfair+Display:wght@400;700' },
  { name: 'JetBrains Mono', stack: '"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace',    gf: 'JetBrains+Mono:wght@400;700' },
];

// ── Location shapes ───────────────────────────────────────────────────────────
const LOC_SHAPES = {
  circle:   { css: 'border-radius:50%;',                                                                                                     label: '●' },
  square:   { css: 'border-radius:3px;',                                                                                                     label: '■' },
  diamond:  { css: 'border-radius:2px;transform:rotate(45deg);',                                                                             label: '◆' },
  triangle: { css: 'clip-path:polygon(50% 0%,100% 100%,0% 100%);border-radius:0;',                                                          label: '▲' },
  star:     { css: 'clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border-radius:0;',   label: '★' },
};

// ── State ─────────────────────────────────────────────────────────────────────
let locations    = [];
let routes       = [];
let locMarkers   = [];
let routeLayers  = [];
let nextRouteType    = 'car';
let expandedIdx      = null;  // which route's style panel is open
let expandedPalette  = null;  // which palette accordion is open in style panel
let expandedLocIdx   = null;  // which location's edit panel is open
let paletteApplyMode = 'sequential'; // 'sequential' | 'bytype'

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([20, 0], 2);
let tileLayer = null;
function setMapTheme(key) {
  const t = THEMES[key] || THEMES.voyager;
  if (tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(t.url, { attribution: t.attr, subdomains: t.sub, maxZoom: 19 }).addTo(map);
}

// ── UI Theme ──────────────────────────────────────────────────────────────────
function applyUiTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('btn-ui-theme').textContent = theme === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('trip-mapper-ui-theme', theme);
}
document.getElementById('btn-ui-theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyUiTheme(cur === 'dark' ? 'light' : 'dark');
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── Geocoding ─────────────────────────────────────────────────────────────────
const NOMINATIM_LANG = navigator.language || 'en';
async function geocodeSearch(query) {
  const res  = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&q=${encodeURIComponent(query)}`, { headers: { 'Accept-Language': NOMINATIM_LANG } });
  return (await res.json()).map(r => ({
    name: r.name || r.display_name.split(',')[0].trim(),
    displayName: r.display_name,
    lat: parseFloat(r.lat), lng: parseFloat(r.lon),
  }));
}
async function reverseGeocode(lat, lng) {
  try {
    const res  = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, { headers: { 'Accept-Language': NOMINATIM_LANG } });
    const data = await res.json();
    return (data.name || data.display_name || '').split(',')[0].trim() || 'My Location';
  } catch { return 'My Location'; }
}

// ── Geometry ──────────────────────────────────────────────────────────────────
function greatCirclePoints(lat1, lng1, lat2, lng2, n = 80) {
  const toR = d => d * Math.PI / 180, toD = r => r * 180 / Math.PI;
  const p1 = toR(lat1), l1 = toR(lng1), p2 = toR(lat2), l2 = toR(lng2);
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2));
  if (d === 0) return [[lat1, lng1]];
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i/n, A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2);
    const y = A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2);
    const z = A*Math.sin(p1)+B*Math.sin(p2);
    pts.push([toD(Math.atan2(z, Math.sqrt(x*x+y*y))), toD(Math.atan2(y, x))]);
  }
  return pts;
}
async function fetchOsrmPoints(profile, from, to) {
  const res  = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`);
  const data = await res.json();
  if (data.code !== 'Ok') throw new Error(data.message);
  return data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
}
async function resolvePoints(route) {
  const from = locations[route.fromIdx], to = locations[route.toIdx];
  const { routing } = ROUTE_META[route.type];
  if (routing === 'greatcircle') return greatCirclePoints(from.lat, from.lng, to.lat, to.lng);
  if (routing.startsWith('osrm-')) {
    try { return await fetchOsrmPoints(routing.replace('osrm-',''), from, to); }
    catch { toast('Routing unavailable — drawing straight line.'); }
  }
  return [[from.lat, from.lng], [to.lat, to.lng]];
}

// ── Polyline options ──────────────────────────────────────────────────────────
function polylineOpts(route) {
  const meta     = ROUTE_META[route.type];
  const color    = route.color ?? meta.color;
  const weight   = route.weight ?? meta.weight;
  const dashArray =
    route.dash === 'solid'  ? null  :
    route.dash === 'dashed' ? '10 7' :
    route.dash === 'dotted' ? '2 8'  :
    meta.dashArray;
  return { color, dashArray, weight, opacity: 0.88 };
}

// ── Draw / clear routes ───────────────────────────────────────────────────────
async function drawRoute(idx) {
  const route = routes[idx]; if (!route) return;
  const layer = L.polyline(await resolvePoints(route), polylineOpts(route)).addTo(map);
  const from = locations[route.fromIdx], to = locations[route.toIdx];
  layer.bindPopup(`<b>${TYPE_EMOJI[route.type]} ${route.type}</b><br/>${from.name} → ${to.name}`);
  while (routeLayers.length <= idx) routeLayers.push(null);
  if (routeLayers[idx]) map.removeLayer(routeLayers[idx]);
  routeLayers[idx] = layer;
}
function clearRouteLayer(idx) {
  if (routeLayers[idx]) { map.removeLayer(routeLayers[idx]); routeLayers[idx] = null; }
}

// ── Location data normalizer ──────────────────────────────────────────────────
function normalizeLoc(l) {
  return {
    name: l.name, lat: l.lat, lng: l.lng,
    description: l.description || '', date: l.date || '',
    shape: l.shape || 'circle', markerColor: l.markerColor || null,
    labelMode:        l.labelMode        || 'always',
    labelPos:         l.labelPos         || 'right',
    labelRound:       l.labelRound       ?? 4,
    labelSize:        l.labelSize        ?? 11,
    labelTextColor:   l.labelTextColor   || '#18181b',

    labelArrow:       l.labelArrow       ?? false,
    labelOffsetX:     l.labelOffsetX     ?? 0,
    labelOffsetY:     l.labelOffsetY     ?? 0,
  };
}

// ── Location markers ──────────────────────────────────────────────────────────
function markerIconHtml(loc) {
  const color = loc.markerColor || '#89b4fa';
  const shape = LOC_SHAPES[loc.shape || 'circle'];
  return `<div style="width:12px;height:12px;background:${color};${shape.css}border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;"></div>`;
}

function buildTooltipStyles() {
  let css = '';
  locations.forEach((loc, i) => {
    const mode = loc.labelMode || 'always';
    if (mode === 'hidden') return;
    const bg     = loc.labelBg          || '#ffffff';
    const text   = loc.labelTextColor   || '#18181b';
    const border = loc.labelBorderColor || loc.markerColor || '#89b4fa';
    const round  = loc.labelRound       ?? 4;
    const size   = loc.labelSize        ?? 11;
    const ox     = loc.labelOffsetX     ?? 0;
    const oy     = loc.labelOffsetY     ?? 0;
    const arrow  = loc.labelArrow       ?? false;
    const drag   = mode === 'always';
    css += `.loc-tt-${i}{`
         + `background:${bg}!important;color:${text}!important;`
         + `border-color:${border}!important;border-radius:${round}px!important;`
         + `font-size:${size}px!important;`
         + `transform:translate(${ox}px,${oy}px);`
         + (drag ? 'pointer-events:auto!important;cursor:grab;' : 'pointer-events:none!important;')
         + `}\n`;
    if (!arrow) {
      css += `.loc-tt-${i}::before{display:none!important;}\n`;
    } else {
      css += `.leaflet-tooltip-right.loc-tt-${i}::before{border-right-color:${border}!important;}\n`;
      css += `.leaflet-tooltip-left.loc-tt-${i}::before{border-left-color:${border}!important;}\n`;
      css += `.leaflet-tooltip-top.loc-tt-${i}::before{border-top-color:${border}!important;}\n`;
      css += `.leaflet-tooltip-bottom.loc-tt-${i}::before{border-bottom-color:${border}!important;}\n`;
    }
  });
  let el = document.getElementById('loc-tt-styles');
  if (!el) { el = document.createElement('style'); el.id = 'loc-tt-styles'; document.head.appendChild(el); }
  el.textContent = css;
}

function addLocMarker(loc, locIdx) {
  const icon = L.divIcon({
    className: `loc-mk-${locIdx}`,
    html: markerIconHtml(loc),
    iconAnchor: [6, 6], iconSize: [12, 12],
  });
  const marker = L.marker([loc.lat, loc.lng], { icon }).addTo(map);
  const mode = loc.labelMode || 'always';
  if (mode !== 'hidden') {
    marker.bindTooltip(loc.name, {
      direction: loc.labelPos || 'right',
      permanent: mode === 'always',
      opacity: 1,
      className: `loc-label-tt loc-tt-${locIdx}`,
    });
  }
  marker.on('click', () => {
    expandedLocIdx = expandedLocIdx === locIdx ? null : locIdx;
    renderLocList();
    setTimeout(() => {
      const el = document.getElementById(`loc-item-${locIdx}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 30);
  });
  locMarkers.push({ marker });
}
function clearLocMarkers() {
  locMarkers.forEach(({ marker }) => map.removeLayer(marker));
  locMarkers = [];
}
function rebuildMarkers() {
  clearLocMarkers();
  buildTooltipStyles();
  locations.forEach(addLocMarker);
}

// ── Label drag ────────────────────────────────────────────────────────────────
function enableLabelDrag() {
  document.addEventListener('mousedown', e => {
    const tt = e.target.closest('.loc-label-tt');
    if (!tt) return;
    const cls = [...tt.classList].find(c => /^loc-tt-\d+$/.test(c));
    if (!cls) return;
    const locIdx = parseInt(cls.replace('loc-tt-', ''), 10);
    const loc = locations[locIdx];
    if (!loc || (loc.labelMode || 'always') !== 'always') return;

    e.preventDefault();
    e.stopPropagation();
    map.dragging.disable();

    const startX = e.clientX, startY = e.clientY;
    const origOX = loc.labelOffsetX ?? 0, origOY = loc.labelOffsetY ?? 0;
    let moved = false;

    function onMove(e) {
      moved = true;
      tt.style.cursor = 'grabbing';
      locations[locIdx].labelOffsetX = origOX + (e.clientX - startX);
      locations[locIdx].labelOffsetY = origOY + (e.clientY - startY);
      buildTooltipStyles();
    }
    function onUp(e) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      map.dragging.enable();
      tt.style.cursor = '';
      if (moved) { save(); e.stopPropagation(); }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── Next-mode buttons ─────────────────────────────────────────────────────────

    buildTooltipStyles(); save();
  });
  dragRow.appendChild(resetBtn);
  panel.appendChild(dragRow);

  // Roundness slider
  const roundRow = document.createElement('div'); roundRow.className = 'lep-row';
  roundRow.innerHTML = '<span class="lep-label">Round</span>';
  const roundSlider = document.createElement('input');
  roundSlider.type='range'; roundSlider.min=0; roundSlider.max=20; roundSlider.step=1;
  roundSlider.value = loc.labelRound ?? 4; roundSlider.className = 'sp-slider';
  const roundVal = document.createElement('span'); roundVal.className = 'sp-slider-val';
  roundVal.textContent = `${loc.labelRound ?? 4}px`;
  roundSlider.addEventListener('input', () => { roundVal.textContent = `${roundSlider.value}px`; });
  roundSlider.addEventListener('change', () => { locations[locIdx].labelRound = parseInt(roundSlider.value); buildTooltipStyles(); save(); });
  roundRow.appendChild(roundSlider); roundRow.appendChild(roundVal);
  panel.appendChild(roundRow);

  // Font size slider
  const lblSizeRow = document.createElement('div'); lblSizeRow.className = 'lep-row';
  lblSizeRow.innerHTML = '<span class="lep-label">Size</span>';
  const sizeSlider = document.createElement('input');
  sizeSlider.type='range'; sizeSlider.min=8; sizeSlider.max=18; sizeSlider.step=1;
  sizeSlider.value = loc.labelSize ?? 11; sizeSlider.className = 'sp-slider';
  const sizeVal = document.createElement('span'); sizeVal.className = 'sp-slider-val';
  sizeVal.textContent = `${loc.labelSize ?? 11}px`;
  sizeSlider.addEventListener('input', () => { sizeVal.textContent = `${sizeSlider.value}px`; });
  sizeSlider.addEventListener('change', () => { locations[locIdx].labelSize = parseInt(sizeSlider.value); buildTooltipStyles(); save(); });
  lblSizeRow.appendChild(sizeSlider); lblSizeRow.appendChild(sizeVal);
  panel.appendChild(lblSizeRow);

  // Text / BG / Border color pickers
  [
    { key: 'labelTextColor',   label: 'Text',     def: '#18181b' },
    { key: 'labelBg',          label: 'Label BG', def: '#ffffff' },
    { key: 'labelBorderColor', label: 'Border',   def: loc.markerColor || '#89b4fa' },
  ].forEach(({ key, label, def }) => {
    const row = document.createElement('div'); row.className = 'lep-row';
    row.innerHTML = `<span class="lep-label">${label}</span>`;
    const inp = document.createElement('input'); inp.type = 'color';
    inp.value = loc[key] || def;
    inp.style.cssText = 'width:34px;height:24px;border:none;border-radius:5px;cursor:pointer;padding:1px;flex-shrink:0;';
    inp.addEventListener('input', () => { locations[locIdx][key] = inp.value; buildTooltipStyles(); save(); });
    row.appendChild(inp);
    panel.appendChild(row);
  });

  // Apply all labels button
  const lblAllRow = document.createElement('div'); lblAllRow.className = 'lep-row';
  lblAllRow.style.justifyContent = 'flex-end';
  const lblAllBtn = document.createElement('button');
  lblAllBtn.className = 'palette-apply'; lblAllBtn.textContent = '↓ Apply label style to all stops';
  lblAllBtn.addEventListener('click', () => {
    const src = locations[locIdx];
    const keys = ['labelMode','labelPos','labelRound','labelSize','labelTextColor','labelBg','labelBorderColor','labelArrow'];
    locations.forEach((l, j) => { if (j !== locIdx) keys.forEach(k => { l[k] = src[k]; }); });
    rebuildMarkers(); renderLocList(); save();
  });
  lblAllRow.appendChild(lblAllBtn);
  panel.appendChild(lblAllRow);

  return panel;
}

// ── Render location list ──────────────────────────────────────────────────────
function renderLocList() {
  renderNextModeBtns();
  const el = document.getElementById('loc-list');
  el.innerHTML = '';

  if (!locations.length) {
    el.innerHTML = '<div class="empty-hint">Search a place or click "Pick on map" to start your trip.</div>';
    return;
  }

  locations.forEach((loc, i) => {
    if (i > 0) {
      const r    = routes.find(r => r.fromIdx === i-1 && r.toIdx === i);
      const rIdx = routes.indexOf(r);
      const conn = document.createElement('div');
      conn.className = 'connector';

      // Top row: bar + mode buttons + style toggle
      const row = document.createElement('div');
      row.className = 'connector-row';
      const bar = document.createElement('div');
      bar.className = 'connector-bar';
      row.appendChild(bar);
      if (r) {
        row.appendChild(makeSegmentModeBtns(rIdx, r.type));
        const swatch = document.createElement('div');
        swatch.style.cssText = `width:8px;height:8px;border-radius:50%;background:${r.color ?? ROUTE_META[r.type].color};flex-shrink:0;`;
        row.appendChild(swatch);
        const toggle = document.createElement('button');
        toggle.className = 'style-toggle' + (expandedIdx === rIdx ? ' open' : '');
        toggle.textContent = '✦'; toggle.title = 'Style segment';
        toggle.addEventListener('click', () => {
          expandedIdx = expandedIdx === rIdx ? null : rIdx;
          expandedPalette = null;
          renderLocList();
        });
        row.appendChild(toggle);
      }
      conn.appendChild(row);

      // Style panel (expanded)
      if (r && expandedIdx === rIdx) conn.appendChild(makeStylePanel(rIdx, r));

      el.appendChild(conn);
    }

    const item = document.createElement('div');
    item.className = 'list-item'; item.id = `loc-item-${i}`;
    const sub = [loc.date, `${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}`].filter(Boolean).join(' · ');
    item.innerHTML =
      `<div class="loc-num" style="background:${loc.markerColor||'var(--accent)'};">${i+1}</div>
       <div class="item-body">
         <div class="item-name">${loc.name}</div>
         <div class="item-sub">${sub}</div>
       </div>
       <button class="btn-sm edit" title="Edit">✎</button>
       <button class="btn-sm fly"  title="Fly to">⌖</button>
       <button class="btn-sm del"  title="Remove">✕</button>`;
    item.querySelector('.edit').addEventListener('click', () => {
      expandedLocIdx = expandedLocIdx === i ? null : i;
      renderLocList();
    });
    item.querySelector('.fly').addEventListener('click', () => map.flyTo([loc.lat, loc.lng], 10));
    item.querySelector('.del').addEventListener('click', () => deleteLocation(i));
    el.appendChild(item);

    if (expandedLocIdx === i) el.appendChild(makeLocEditPanel(i));
  });
}

// ── Change route type ─────────────────────────────────────────────────────────
async function changeRouteType(idx, newType) {
  routes[idx].type = newType;
  clearRouteLayer(idx);
  await drawRoute(idx);
  renderLocList();
  save();
}

// ── Fit map ───────────────────────────────────────────────────────────────────
function fitAll() {
  if (!locations.length) return;
  map.fitBounds(L.latLngBounds(locations.map(l => [l.lat, l.lng])).pad(0.15));
}

// ── Storage ───────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('trip-mapper-v2', JSON.stringify({ locations, routes }));
}
function load() {
  try {
    const raw = localStorage.getItem('trip-mapper-v2');
    if (!raw) return;
    const d = JSON.parse(raw);
    locations = (d.locations || []).map(normalizeLoc);
    // Migrate old route format
    routes = (d.routes || []).map(r => ({
      fromIdx: r.fromIdx, toIdx: r.toIdx, type: r.type || 'car',
      color:  r.color  ?? (r.colorMode === 'custom' ? r.customColor : null),
      dash:   r.dash   ?? (r.style === 'solid' ? 'solid' : r.style === 'dashed' ? 'dashed' : r.style === 'dotted' ? 'dotted' : 'default'),
      weight: r.weight ?? null,
    }));
  } catch {}
}

// ── Full rebuild ──────────────────────────────────────────────────────────────
async function rebuildAll() {
  clearLocMarkers();
  routeLayers.forEach((_, i) => clearRouteLayer(i));
  routeLayers = [];
  buildTooltipStyles();
  locations.forEach(addLocMarker);
  for (let i = 0; i < routes.length; i++) await drawRoute(i);
  renderLocList();
}

// ── Add location with auto-route ──────────────────────────────────────────────
function makeRoute(fromIdx, toIdx) {
  return { fromIdx, toIdx, type: nextRouteType, color: null, dash: 'default', weight: null };
}

async function addLocationAuto(name, lat, lng) {
  const prevIdx = locations.length - 1;
  const locIdx  = locations.length;
  locations.push(normalizeLoc({ name, lat, lng }));
  addLocMarker(locations[locIdx], locIdx);

  if (prevIdx >= 0) {
    const rIdx = routes.length;
    routes.push(makeRoute(prevIdx, locIdx));
    await drawRoute(rIdx);
  }

  fitAll(); renderLocList(); save();
  toast(`Added "${name}"`);
}

// ── Delete location (chain reconnect) ─────────────────────────────────────────
async function deleteLocation(idx) {
  const hasPrev = idx > 0, hasNext = idx < locations.length - 1;
  const nextR = routes.find(r => r.fromIdx === idx && r.toIdx === idx+1);
  const prevR = routes.find(r => r.toIdx === idx && r.fromIdx === idx-1);
  const reconnectType = (nextR || prevR)?.type || 'car';

  clearLocMarkers();
  routeLayers.forEach((_, i) => clearRouteLayer(i));
  routeLayers = [];
  expandedIdx = null;
  expandedLocIdx = expandedLocIdx === idx ? null : expandedLocIdx > idx ? expandedLocIdx - 1 : expandedLocIdx;

  locations.splice(idx, 1);
  routes = routes.filter(r => r.fromIdx !== idx && r.toIdx !== idx);
  routes.forEach(r => {
    if (r.fromIdx > idx) r.fromIdx--;
    if (r.toIdx   > idx) r.toIdx--;
  });

  if (hasPrev && hasNext) {
    routes.push({ fromIdx: idx-1, toIdx: idx, type: reconnectType, color: null, dash: 'default', weight: null });
    routes.sort((a, b) => a.fromIdx - b.fromIdx);
  }

  locations.forEach(addLocMarker);
  for (let i = 0; i < routes.length; i++) await drawRoute(i);
  renderLocList(); save();
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchDebounce = null;

function showSearchResults(results) {
  const drop = document.getElementById('search-drop');
  drop.innerHTML = '';
  if (!results.length) {
    drop.innerHTML = '<div class="s-item" style="cursor:default;color:var(--fg2);">No results found.</div>';
    drop.style.display = 'flex'; return;
  }
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 's-item';
    item.innerHTML = `<div class="s-item-name">${r.name}</div><div class="s-item-sub">${r.displayName}</div>`;
    item.addEventListener('click', () => {
      drop.style.display = 'none';
      document.getElementById('loc-search').value = '';
      addLocationAuto(r.name, r.lat, r.lng);
    });
    drop.appendChild(item);
  });
  drop.style.display = 'flex';
}

async function doSearch() {
  const q = document.getElementById('loc-search').value.trim(); if (!q) return;
  const btn = document.getElementById('btn-search');
  btn.textContent = '…'; btn.disabled = true;
  try { showSearchResults(await geocodeSearch(q)); }
  catch { toast('Search failed. Check your connection.'); }
  btn.textContent = 'Go'; btn.disabled = false;
}

document.getElementById('loc-search').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
document.getElementById('loc-search').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const q = document.getElementById('loc-search').value.trim();
  if (!q) { document.getElementById('search-drop').style.display = 'none'; return; }
  searchDebounce = setTimeout(doSearch, 500);
});
document.getElementById('btn-search').addEventListener('click', doSearch);
document.addEventListener('click', e => {
  if (!e.target.closest('#search-drop') && !e.target.closest('#loc-search') && e.target.id !== 'btn-search')
    document.getElementById('search-drop').style.display = 'none';
});

// ── Pick on map ───────────────────────────────────────────────────────────────
let pickMode = false;

function enterPickMode() {
  pickMode = true;
  document.getElementById('map').classList.add('pick-mode');
  const btn = document.getElementById('btn-pick-loc');
  btn.textContent = '✕ Cancel pick';
  btn.classList.remove('btn-green');
  btn.classList.add('btn-red');
  toast('Click anywhere on the map to place a stop.');
}

function exitPickMode() {
  pickMode = false;
  document.getElementById('map').classList.remove('pick-mode');
  const btn = document.getElementById('btn-pick-loc');
  btn.textContent = '📌 Pick on map';
  btn.classList.remove('btn-red');
  btn.classList.add('btn-green');
  btn.disabled = false;
}

document.getElementById('btn-pick-loc').addEventListener('click', () => {
  if (pickMode) { exitPickMode(); return; }
  enterPickMode();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && pickMode) exitPickMode(); });

map.on('click', async e => {
  if (!pickMode) return;
  exitPickMode();
  const { lat, lng } = e.latlng;
  const btn = document.getElementById('btn-pick-loc');
  btn.textContent = '📌 Resolving…'; btn.disabled = true;
  const name = await reverseGeocode(lat, lng);
  btn.textContent = '📌 Pick on map'; btn.disabled = false;
  await addLocationAuto(name, lat, lng);
});

// ── Map theme ─────────────────────────────────────────────────────────────────
document.getElementById('theme-select').addEventListener('change', e => {
  setMapTheme(e.target.value);
  localStorage.setItem('trip-mapper-map-theme', e.target.value);
});

// ── Export / Import / Clear ───────────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ locations, routes }, null, 2)], { type: 'application/json' });
  Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'trip-mapper.json' }).click();
});
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const d = JSON.parse(ev.target.result);
      const rawLocs = Array.isArray(d) ? d : (d.locations || []);
      locations = rawLocs.map(normalizeLoc);
      routes = (d.routes || []).map(r => ({ fromIdx: r.fromIdx, toIdx: r.toIdx, type: r.type || 'car', color: r.color ?? null, dash: r.dash ?? 'default', weight: r.weight ?? null }));
      await rebuildAll(); fitAll(); save();
      toast('Imported successfully.');
    } catch { alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('Delete all locations and routes?')) return;
  clearLocMarkers();
  routeLayers.forEach((_, i) => clearRouteLayer(i));
  locations = []; routes = []; routeLayers = []; expandedIdx = null;
  renderLocList(); save();
});

// ── Font ──────────────────────────────────────────────────────────────────────
let _fontLink = null;
function applyFont(name) {
  const font = FONTS.find(f => f.name === name) || FONTS[0];
  if (font.gf) {
    if (!_fontLink) {
      _fontLink = document.createElement('link');
      _fontLink.rel = 'stylesheet'; document.head.appendChild(_fontLink);
    }
    _fontLink.href = `https://fonts.googleapis.com/css2?family=${font.gf}&display=swap`;
  }
  document.documentElement.style.setProperty('--font-family', font.stack);
  localStorage.setItem('trip-mapper-font', name);
}
document.getElementById('font-select').addEventListener('change', e => applyFont(e.target.value));

// ── Boot ──────────────────────────────────────────────────────────────────────
// Populate font select
FONTS.forEach(f => {
  const opt = document.createElement('option'); opt.value = f.name; opt.textContent = f.name;
  document.getElementById('font-select').appendChild(opt);
});

const savedUiTheme  = localStorage.getItem('trip-mapper-ui-theme')  || 'dark';
const savedMapTheme = localStorage.getItem('trip-mapper-map-theme') || 'voyager';
const savedFont     = localStorage.getItem('trip-mapper-font')      || 'System UI';
applyUiTheme(savedUiTheme);
document.getElementById('theme-select').value = savedMapTheme;
setMapTheme(savedMapTheme);
document.getElementById('font-select').value = savedFont;
applyFont(savedFont);
enableLabelDrag();
load();
rebuildAll().then(fitAll);
</script>
